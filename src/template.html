    <!-- Applies the saved user-preferred theme in the user agent's local storage before the CSS is rendered, preventing Flash of Incorrect Theme (FOIT). -->
    <script type="text/javascript" id="apply-user-preferred-theme">
      const userPreferredTheme = localStorage.getItem('userPreferredTheme');
      document.documentElement.classList.add(userPreferredTheme);
    </script>

    <header id="page-header">
      <!--
      The `a` element is a child of the `h1` element and not vice versa, as this approach makes more sense from a semantic point of view.

      Refer to: https://stackoverflow.com/questions/20174426/html-how-to-make-h1-h2-etc-as-links.
      -->

      <!--
      Including text that informs users of assistive technology of the function of the link will cause it to be part of the accessible name of the parent heading, causing redundancy.
      It is universally understood that the link inside the level 1 heading of a website leads to the homepage.
      -->

      <h1 id="page-title" class="minimalist-logo-and-wordmark">
        <!-- Class `icon-with-text` is not assigned to links that open in a new tab, as these can be selected with `a[target="blank"]`. -->

        <a href="/" class="icon-with-text">
          <svg xmlns="http://www.w3.org/2000/svg" class="minimalist-logo" aria-hidden="true">
            <use href="#minimalist-logo"></use>
          </svg>

          <span class="minimalist-wordmark">
            MinimaList
          </span>
        </a>
      </h1>

      <!-- TODO: Implement light/dark theme switching functionality. You will need to dynamically set the values of `#theme-toggle[aria-label]` and `#theme-toggle use[href]`. -->
      <div class="button-link-row">
        <button type="button" id="theme-toggle" aria-label="Switch to Dark Theme">
          <svg xmlns="http://www.w3.org/2000/svg" class="theme-icon" aria-hidden="true">
            <use href="#dark-theme-icon"></use>
          </svg>
        </button>
      </div>
    </header>

    <main id="page-main">
      
    </main>

    <footer id="page-footer" class="inverted-color-scheme">
      <div id="footer-text">
        <section class="about-product">
          <!-- TODO: Use the appropriate semantic elements instead of the following `span` elements used for section headings. -->
          
          <span class="sr-only">
            About MinimaList
          </span>

          <span class="minimalist-logo-and-wordmark no-logo">
            <a href="/">
              <span class="minimalist-wordmark">
                MinimaList
              </span>
            </a>
          </span>

          <div class="links-container">
            <a href="https://www.github.com/alikamel-dev/to-do-list" target="_blank" rel="noopener noreferrer">
              GitHub repository

              <span class="sr-only">
                (opens in a new tab)
              </span>

              <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <use href="#opens-in-new-tab-icon"></use>
              </svg>
            </a>
          </div>
        </section>

        <section class="about-author">
          <span class="sr-only">
            About author
          </span>

          <div class="author-name">
            Created with <span aria-hidden="true">❤️</span> <span class="sr-only">love</span> by

            <b class="author-name">
              Ali Kamel
            </b>
          </div>

          <div class="links">
            <span class="sr-only">
              Author website and profiles
            </span>

            <div class="links-container">
              <a href="https://www.github.com/alikamel-dev" target="_blank" rel="author noopener noreferrer" aria-label="GitHub (opens in a new tab)" class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <use href="#github-logo"></use>
                </svg>
              </a>

              <a href="https://bsky.app/profile/ali-kamel.bsky.social" target="__blank" rel="author noopener noreferrer" aria-label="Bluesky (opens in a new tab)" class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <use href="#bluesky-logo"></use>
                </svg>
              </a>

              <a href="https://mastodon.social/@ali_kamel" target="__blank" rel="author noopener noreferrer" aria-label="Mastodon (opens in a new tab)" class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <use href="#mastodon-logo"></use>
                </svg>
              </a>

              <a href="https://alikamel-dev.github.io/homepage" target="_blank" rel="author noopener noreferrer" aria-label="Website (opens in a new tab)" class="icon">
                <!-- Website icon appears smaller than other icons, hence the upscaling. -->
                <svg xmlns="http://www.w3.org/2000/svg" style="transform: scale(1.15)" aria-hidden="true">
                  <use href="#website-icon"></use>
                </svg>
              </a>
            </div>
          </div>
        </section>
      </div>

      <div id="footer-illustration">
        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <use href="#minimalist-logo-tickmark"></use>
        </svg>
      </div>
    </footer>
